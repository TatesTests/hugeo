source: ''
paths:
  static: static
  uploads: static/uploads
  data: data
  collections: content
  includes: layouts
  layouts: layouts
  source: ''
  archetypes: archetypes
  assets: assets
  content: content
  pages: content
  publish: public
  config: ''
collections_config:
  pages:
    output: true
    filter: strict
    parse_branch_index: true
    auto_discovered: true
    path: content
  posts:
    path: content/posts
    output: true
  data:
    output: false
    auto_discovered: false
    path: data
collection_groups: null
_enabled_editors: null
_inputs:
  large_header:
    type: text
    comment: Toggles the size of the top banner.
  show_in_navigation:
    type: text
    comment: Toggles a link in the top banner.
  author_staff_member:
    type: text
    comment: The staff member writing this post.
  call_to_action:
    type: text
    comment: Type of request shown at the bottom of this page.
  background_image_path:
    type: image
    comment: Image shown in the top banner, blank for the default.
  testimonials:
    type: text
    comment: Update, add or remove testimonials.
  map:
    type: text
    comment: Update the map location and display settings.
  latitude:
    type: text
    comment: Coordinates for the center marker on the map.
  longitude:
    type: text
    comment: Coordinates for the center marker on the map.
  zoom:
    type: text
    comment: The zoom level for the map.
  phone_extension:
    type: text
    comment: The digits after dialing the company phone.
  credentials:
    type: text
    comment: Shown as subtext on staff member summaries.
  contact_email_address:
    type: email
    comment: Address for the contact form to send to.
  new_window:
    type: text
    comment: Whether the link opens a new browser tab/window.
  type:
    type: text
    options:
      hidden: true
_select_data:
  call_to_actions:
    - Contact
    - Blog
    - Map
  social_icons:
    - Facebook
    - Instagram
    - LinkedIn
    - Pinterest
    - Tumblr
    - Twitter
    - YouTube
    - RSS
_structures: {}
_editables: {}
base_url: ''
editor: null
source_editor: null
timezone: Etc/UTC
_snippets_imports:
  hugo: true
_snippets:
  test:
    template: hugo_paired_shortcode
    definitions:
      shortcode_name: test
      content_key: content
    _inputs:
      content:
        type: markdown
